name: Develop - CI/CD & Deploy to Dev

on:
  push:
    branches: [develop]

jobs:
  build-and-test:
    permissions:
      contents: read
      packages: read
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-java-ci.yml@main
    with:
      java_version: '21'
      skip_checkstyle: true
      build_command: 'mvn -B -ntp -U clean verify'
      upload_jacoco_reports: true
      jacoco_artifact_name: 'jacoco-reports-${{ github.run_id }}'
      jacoco_report_path: '**/target/site/jacoco/jacoco.xml'
    secrets: inherit

  sonar:
    needs: build-and-test
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-sonar-java.yml@main
    with:
      java_version: '21'
      sonar_org: 'fiap-soat-grupo36'
      sonar_project_key: 'notification-service'
      maven_skip_tests: true
      download_jacoco_artifacts: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    needs: [build-and-test, sonar]
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-dockerhub.yml@main
    with:
      modules: '["notification-service"]'
      dockerfile_pattern: './Dockerfile'
      registry_namespace: 'fiapsoatgrupo36'
      tag_strategy: 'both'
      push_images: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  verify-infrastructure:
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-terraform.yml@main
    with:
      workspace: dev
      environment: dev
      working_directory: ./infra
      auto_apply: false
      localstack_pod: fiap
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  # 4. Deploy to Dev Environment
  deploy-dev:
    needs: [docker,verify-infrastructure]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-terraform.yml@main
    with:
      workspace: dev
      environment: dev
      working_directory: ./infra
      auto_apply: true
      localstack_pod: fiap
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}


  # 5. Criar PR Automático para Main (Produção)
  create-pr-to-main:
    needs: deploy-dev
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-create-pr.yml@main
    with:
      base: main
      head: develop
      title: "🚀 Deploy to Production - ${{ github.sha }}"
      body: |
        ## 🎯 Ready for Production Deployment
        
        **Environment:** Development → Production
        **Commit:** `${{ github.sha }}`
        **Deployed to Dev:** ✅ Successful
        
        **Environment:** Development → Production
        **Commit:** `${{ github.sha }}`

        ### ✅ CI/CD Status
        - ✅ Unit tests passed
        - ✅ Code coverage analyzed
        - ✅ SonarCloud quality gate passed
        - ✅ Docker image published
        - ✅ Deployed successfully to DEV
        
        ### 📦 Docker Image
        - **Image:** `fiapsoatgrupo36/customer-service:develop-${{ github.sha }}`
        
        ### 🔍 Review Checklist
        - [ ] All features tested in DEV
        - [ ] No critical bugs reported
        - [ ] Performance validated
        - [ ] Security review completed
        
        Ready for production deployment! 🚀
      draft: false

