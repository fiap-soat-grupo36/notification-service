spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL_USERNAME:oficina.fiap@gmail.com}
    password: ${EMAIL_PASSWORD:senha-app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    test-connection: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8087}

app:
  notification:
    email:
      sender: ${EMAIL_SENDER:oficina.fiap@gmail.com}
  messaging:
    customer-created:
      queue: ${CUSTOMER_CREATED_QUEUE:notification.customer-created}
      exchange: ${CUSTOMER_CREATED_EXCHANGE:oficina.customer.events}
      routing-key: ${CUSTOMER_CREATED_ROUTING_KEY:customer.created}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
